name: pedidos360-local
x-node: &node
  image: pedidos360-local-app
  build: { context: .., dockerfile: local/Dockerfile }
  init: true
  environment: &env
    DYNAMODB_ENDPOINT: http://dynamodb:8000
    SNS_ENDPOINT: http://localstack:4566
    SQS_ENDPOINT: http://localstack:4566
    KAFKA_BROKERS: kafka1:29092,kafka2:29092
    ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Ejecuta configurar.cjs}
    ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?Ejecuta configurar.cjs}
    ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:?Ejecuta configurar.cjs}
    ENTRA_SCOPE: ${ENTRA_SCOPE:?Ejecuta configurar.cjs}
    ENTRA_TOKEN_VERSION: ${ENTRA_TOKEN_VERSION:-2}
    LAB_CONTROL_SECRET: ${LAB_CONTROL_SECRET:?Ejecuta configurar.cjs}
    ENABLE_LOCAL_LAB: "true"
    HTTP_HOST: 0.0.0.0
    QUIET_MESSAGES: "1"
    REPORT_URL: http://report:3001
    AUDIT_URL: http://audit:3002
    ZK_CONNECT: zoo1:2181,zoo2:2181,zoo3:2181
  depends_on:
    api: { condition: service_healthy }
services:
  localstack:
    image: localstack/localstack:4.0.3
    ports: ["127.0.0.1:14566:4566"]
    environment:
      SERVICES: sns,sqs
      SQS_ENDPOINT_STRATEGY: path
      LOCALSTACK_HOST: localstack:4566
      DEBUG: "0"
    healthcheck:
      test: ["CMD-SHELL","awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  zoo1: &zoo
    image: zookeeper:3.8.4
    environment: &zenv
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: ruok,stat,srvr,conf,mntr
      JVMFLAGS: -XX:ActiveProcessorCount=2 -Xms128m -Xmx256m
    ports: ["127.0.0.1:12181:2181"]
    volumes: [zoo1-data:/data,zoo1-log:/datalog]
  zoo2:
    <<: *zoo
    environment: { <<: *zenv, ZOO_MY_ID: 2 }
    ports: ["127.0.0.1:12182:2181"]
    volumes: [zoo2-data:/data,zoo2-log:/datalog]
  zoo3:
    <<: *zoo
    environment: { <<: *zenv, ZOO_MY_ID: 3 }
    ports: ["127.0.0.1:12183:2181"]
    volumes: [zoo3-data:/data,zoo3-log:/datalog]
  kafka1: &broker
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zoo1,zoo2,zoo3]
    ports: ["127.0.0.1:19093:9093"]
    environment: &kenv
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zoo1:2181,zoo2:2181,zoo3:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://127.0.0.1:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka1-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL","kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s
  kafka2:
    <<: *broker
    ports: ["127.0.0.1:19094:9093"]
    environment:
      <<: *kenv
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://127.0.0.1:19094
    volumes: [kafka2-data:/var/lib/kafka/data]
  dynamodb:
    image: amazon/dynamodb-local:latest
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    ports: ["127.0.0.1:18000:8000"]
    volumes: [ddb-data:/data]
  api:
    <<: *node
    command: node local/api.cjs
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      dynamodb: { condition: service_started }
      localstack: { condition: service_healthy }
    ports: ["127.0.0.1:3100:3100"]
    volumes: ["./resultados:/app/local/resultados"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:3100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
  report:
    <<: *node
    command: node local/projection.cjs
    environment: { <<: *env, SERVICE: report }
    ports: ["127.0.0.1:3001:3001"]
    healthcheck: &projectionHealth
      test: ["CMD-SHELL","node -e \"fetch('http://localhost:'+(process.env.SERVICE==='report'?3001:3002)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
  audit:
    <<: *node
    command: node local/projection.cjs
    environment: { <<: *env, SERVICE: audit }
    ports: ["127.0.0.1:3002:3002"]
    healthcheck: *projectionHealth
  frontend:
    <<: *node
    command: npm run dev -- --config local/vite.config.mts --mode lab
    ports: ["127.0.0.1:5173:5173"]
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on: [kafka1,kafka2]
    ports: ["127.0.0.1:18081:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zoo1:2181,zoo2:2181,zoo3:2181
  zoonavigator:
    image: elkozmon/zoonavigator:1.1.3
    ports: ["127.0.0.1:19000:9000"]
    environment: { HTTP_PORT: 9000 }
volumes:
  zoo1-data:
  zoo1-log:
  zoo2-data:
  zoo2-log:
  zoo3-data:
  zoo3-log:
  kafka1-data:
  kafka2-data:
  ddb-data:
